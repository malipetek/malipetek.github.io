name: Deploy

# master is the only deploy branch. A merge lands here; nothing goes live from a
# laptop folder. See AGENTS.md → Deploy.
#
# One repo secret is required: CLOUDFLARE_API_TOKEN, with
#   Workers Scripts:Edit, Workers Routes:Edit, D1:Edit, Zone:Read
# on the malipetek.dev and malipetek.online zones. The account id is fixed below.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a60af2542282e283101650bebed42dcf
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the Cloudflare token is configured
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repo secret (Workers Scripts:Edit, Workers Routes:Edit, D1:Edit, Zone:Read)."
            exit 1
          fi

      - name: Site dependencies
        run: pnpm install --frozen-lockfile

      - name: Worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Worker typecheck and unit tests
        working-directory: worker
        run: pnpm run typecheck && pnpm run test:unit

      - name: Worker end-to-end tests
        working-directory: worker
        run: pnpm run test:e2e

      # D1 migrations are idempotent — wrangler records them in d1_migrations —
      # so applying on every deploy is the safe order: schema first, then code.
      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply malipetek-portal --remote

      - name: Deploy the intercom Worker
        working-directory: worker
        run: pnpm run deploy -- --var BUILD_SHA:${{ github.sha }}

      - name: Build the site
        run: pnpm run build

      - name: Deploy the site Worker
        run: npx wrangler deploy --var BUILD_SHA:${{ github.sha }}

      - name: Deploy malipetek-sites
        run: npx wrangler deploy -c sites-worker/wrangler.jsonc --var BUILD_SHA:${{ github.sha }}

      - name: Summary
        run: |
          echo "### Deployed \`${GITHUB_SHA:0:8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: https://malipetek.dev/portal/admin#health" >> "$GITHUB_STEP_SUMMARY"
